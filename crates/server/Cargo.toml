[package]
name = "ttp-server"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
futures-util = { version = "0.3", default-features = false }
percent-encoding = "2"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["net", "rt", "sync"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
ttp-core = { path = "../core" }

[dev-dependencies]
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
tempfile.workspace = true
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "time"] }
