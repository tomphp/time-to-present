<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Time to Present</title>
    <link rel="stylesheet" href="/src/styles/start.css" />
  </head>
  <body class="start">
    <aside class="start-actions">
      <img class="app-icon" src="/src-tauri/icons/128x128@2x.png" alt="" />
      <h1>Time to Present</h1>
      <button id="new-presentation" class="action primary" type="button">New Presentation…</button>
      <button id="open-folder" class="action" type="button">Open Folder…</button>
      <button id="check-microphone" class="action" type="button">Check microphone</button>
    </aside>
    <main class="recent card">
      <h2 id="recent-heading">Recent</h2>
      <p id="notice" class="banner" role="status" hidden></p>
      <p id="error" class="banner" role="alert" hidden></p>
      <ul id="recent-list" role="listbox" tabindex="0" aria-labelledby="recent-heading"></ul>
      <p id="recent-empty" class="muted" hidden>Presentations you open appear here.</p>
    </main>
    <div class="sheet" hidden>
      <form id="title-dialog" class="popover" role="dialog" aria-modal="true" aria-labelledby="title-dialog-heading">
        <h2 id="title-dialog-heading">New Presentation</h2>
        <label>Title <input name="title" required /></label>
        <div class="dialog-buttons">
          <button class="btn" type="button" data-cancel>Cancel</button>
          <button class="btn primary" type="submit">Choose Folder…</button>
        </div>
      </form>
    </div>
    <script type="module" src="/src/start.ts"></script>
  </body>
</html>
