<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Time to Present</title>
    <link rel="stylesheet" href="/src/app.css" />
  </head>
  <body class="editor">
    <header class="toolbar">
      <input id="title" aria-label="Title" spellcheck="false" />
      <button id="remove-unused" type="button">Remove unused recordings</button>
      <button id="record" type="button" title="Record (⌘R)">Record</button>
      <button id="perform" type="button" title="Perform (⌘⇧P)">Perform</button>
      <details id="perform-menu" class="menu">
        <summary aria-label="Performance Layout" title="Performance Layout"></summary>
        <div class="menu-panel">
          <label
            >Layout
            <select id="perform-layout">
              <option value="twoWindows">Two windows</option>
              <option value="combined">Combined</option>
              <option value="teleprompterOnly">Teleprompter only</option>
            </select>
          </label>
          <label>Teleprompter display <select id="teleprompter-display"></select></label>
          <label>Presentation display <select id="presentation-display"></select></label>
          <label
            >Presentation size
            <select id="presentation-size"></select>
          </label>
        </div>
      </details>
      <div id="clock" class="clock" aria-label="Performance clock">
        <button id="play-pause" type="button">Play</button>
        <button id="preview" type="button" title="Preview from the cursor">Preview</button>
        <button id="listen" type="button" title="Listen to the selected Word">Listen</button>
        <span id="clock-state" aria-label="Clock state"></span>
        <span id="clock-elapsed" aria-label="Script Time">0:00</span>
        <span id="current-word" aria-label="Current Word"></span>
      </div>
      <span id="server-summary" class="server" aria-label="Presentation App server"></span>
    </header>
    <p id="server-notice" role="status" hidden></p>
    <p id="error" role="alert" hidden></p>
    <section id="recording-bar" aria-label="Recording bar" hidden>
      <p id="recording-denied" hidden>
        Time to Present can't use the microphone. Open System Settings › Privacy &amp; Security ›
        Microphone, turn on Time to Present, then quit and reopen it.
      </p>
      <p id="recording-notice" role="status" hidden></p>
      <div id="recording-controls" class="controls">
        <label>Input <select id="input-device"></select></label>
        <label>Channel <select id="input-channel"></select></label>
        <div class="meter" role="meter" aria-label="Input level" aria-valuemin="0" aria-valuemax="1">
          <div id="meter-fill"></div>
        </div>
        <button id="clip" class="clip" type="button" title="Clipped. Click to reset.">Clip</button>
        <span id="elapsed" aria-label="Elapsed">0:00</span>
        <button id="start-recording" type="button">Start</button>
        <button id="stop-recording" type="button">Stop</button>
        <button id="cancel-recording" type="button">Cancel</button>
      </div>
      <p id="confirm-cancel" hidden>
        Discard this recording?
        <button id="discard-recording" type="button">Discard</button>
        <button id="keep-recording" type="button">Keep recording</button>
      </p>
      <button id="close-recording-bar" type="button">Close</button>
    </section>
    <form id="event-editor" aria-label="Named Event" hidden>
      <label>Name <input name="name" list="event-names" autocomplete="off" spellcheck="false" /></label>
      <datalist id="event-names"></datalist>
      <label>Data <textarea name="data" rows="3" spellcheck="false" placeholder="Optional JSON"></textarea></label>
      <p role="alert" hidden></p>
      <button type="submit">Save</button>
      <button type="button" data-cancel>Cancel</button>
    </form>
    <form id="inspector" aria-label="Timing" hidden>
      <span data-word>
        <label>Gap ms <input name="gap" inputmode="numeric" autocomplete="off" /></label>
        <label>Duration ms <input name="duration" inputmode="numeric" autocomplete="off" /></label>
        <label>Retime % <input name="percent" inputmode="decimal" value="100" autocomplete="off" /></label>
        <button type="submit">Retime</button>
      </span>
      <span data-event>
        <label>Offset ms <input name="offset" inputmode="numeric" autocomplete="off" /></label>
      </span>
      <p role="alert" hidden></p>
    </form>
    <article id="script" aria-label="Script"></article>
    <section id="timeline" aria-label="Script Time timeline"></section>
    <script type="module" src="/src/editor.ts"></script>
  </body>
</html>
