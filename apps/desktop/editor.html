<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Time to Present</title>
    <link rel="stylesheet" href="/src/styles/editor.css" />
  </head>
  <body class="editor">
    <header class="toolbar card">
      <input id="title" aria-label="Title" spellcheck="false" />
      <button id="record" class="btn record" type="button" title="Record (⌘R)">Record</button>
      <button id="perform" class="btn primary" type="button" title="Perform (⌘⇧P)">Perform</button>
      <details id="perform-menu" class="menu">
        <summary class="icon-btn"></summary>
        <div class="menu-panel popover">
          <label
            >Layout
            <select id="perform-layout">
              <option value="twoWindows">Two windows</option>
              <option value="combined">Combined</option>
              <option value="teleprompterOnly">Teleprompter only</option>
            </select>
          </label>
          <label>Teleprompter display <select id="teleprompter-display"></select></label>
          <label>Presentation display <select id="presentation-display"></select></label>
          <label
            >Presentation size
            <select id="presentation-size"></select>
          </label>
          <p id="shown-size" class="shown-size" hidden></p>
          <div id="custom-size" class="custom-size" hidden>
            <input id="custom-width" type="number" min="320" max="7680" step="1" aria-label="Width in pixels" />
            ×
            <input id="custom-height" type="number" min="320" max="7680" step="1" aria-label="Height in pixels" />
          </div>
        </div>
      </details>
      <div id="clock" class="transport" aria-label="Transport">
        <button id="play-pause" class="icon-btn" type="button"></button>
        <button id="play-from-cursor" class="icon-btn" type="button"></button>
        <button id="listen" class="icon-btn" type="button"></button>
        <span id="clock-elapsed" class="time" aria-label="Script Time">0:00</span>
        <span id="clock-state" aria-label="Clock state"></span>
      </div>
      <span id="server-summary" class="server" aria-label="Presentation App server"></span>
    </header>
    <section id="recording-bar" class="card" aria-label="Recording bar" hidden>
      <p id="recording-denied" hidden>
        Time to Present can't use the microphone. Open System Settings › Privacy &amp; Security ›
        Microphone, turn on Time to Present, then quit and reopen it.
      </p>
      <p id="recording-notice" role="status" hidden></p>
      <div id="recording-controls" class="controls">
        <label>Input <select id="input-device"></select></label>
        <label>Channel <select id="input-channel"></select></label>
        <div class="meter" role="meter" aria-label="Input level" aria-valuemin="0" aria-valuemax="1">
          <div id="meter-fill"></div>
        </div>
        <button id="clip" class="btn clip" type="button" title="Clipped. Click to reset.">Clip</button>
        <span id="elapsed" class="time" aria-label="Elapsed">0:00</span>
        <button id="start-recording" class="btn record" type="button">Start</button>
        <button id="stop-recording" class="btn" type="button">Stop</button>
        <button id="cancel-recording" class="btn" type="button">Cancel</button>
      </div>
      <p id="confirm-cancel" hidden>
        Discard this recording?
        <button id="discard-recording" class="btn" type="button">Discard</button>
        <button id="keep-recording" class="btn" type="button">Keep recording</button>
      </p>
      <button id="close-recording-bar" class="btn" type="button">Close</button>
    </section>
    <p id="server-notice" class="banner" role="status" hidden></p>
    <p id="error" class="banner" role="alert" hidden></p>
    <p id="script-hint" class="hint" hidden></p>
    <div class="workspace">
      <article id="script" class="card" aria-label="Script"></article>
      <aside id="inspector" class="card" aria-label="Inspector">
        <header>
          <h2 data-title>Inspector</h2>
          <button data-toggle class="icon-btn" type="button"></button>
        </header>
        <div data-body>
          <p data-hint class="muted">Select a Word to see its timing, or press ⌘E to add a Named Event.</p>
          <form id="timing" aria-label="Timing" hidden>
            <h3>Timing</h3>
            <label>Gap ms <input name="gap" inputmode="numeric" autocomplete="off" /></label>
            <label>Duration ms <input name="duration" inputmode="numeric" autocomplete="off" /></label>
            <label>Retime % <input name="percent" inputmode="decimal" value="100" autocomplete="off" /></label>
            <button class="btn" type="submit">Retime</button>
            <p role="alert" hidden></p>
          </form>
          <form id="event-editor" aria-label="Named Event" hidden>
            <h3>Named Event</h3>
            <label>Name <input name="name" list="event-names" autocomplete="off" spellcheck="false" /></label>
            <datalist id="event-names"></datalist>
            <label>Data <textarea name="data" rows="4" spellcheck="false" placeholder="Optional JSON"></textarea></label>
            <label data-offset>Offset ms <input name="offset" inputmode="numeric" autocomplete="off" /></label>
            <p role="alert" hidden></p>
            <div class="actions">
              <button class="btn" type="button" data-cancel>Cancel</button>
              <button class="btn primary" type="submit">Save</button>
            </div>
          </form>
        </div>
      </aside>
    </div>
    <section id="timeline-card" class="card" aria-label="Script Time timeline">
      <div data-resize role="separator" aria-orientation="horizontal" aria-label="Resize timeline" tabindex="0"></div>
      <header>
        <h2 data-title>Timeline</h2>
        <button data-toggle class="icon-btn" type="button"></button>
      </header>
      <div id="timeline" data-body></div>
    </section>
    <script type="module" src="/src/editor.ts"></script>
  </body>
</html>
