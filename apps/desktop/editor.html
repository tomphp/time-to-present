<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Time to Present</title>
    <link rel="stylesheet" href="/src/app.css" />
  </head>
  <body class="editor">
    <header class="toolbar">
      <input id="title" aria-label="Title" spellcheck="false" />
      <button id="record" type="button" title="Record (⌘R)">Record</button>
    </header>
    <p id="error" role="alert" hidden></p>
    <section id="recording-bar" aria-label="Recording bar" hidden>
      <p id="recording-denied" hidden>
        Time to Present can't use the microphone. Open System Settings › Privacy &amp; Security ›
        Microphone, turn on Time to Present, then quit and reopen it.
      </p>
      <p id="recording-notice" role="status" hidden></p>
      <div id="recording-controls" class="controls">
        <label>Input <select id="input-device"></select></label>
        <label>Channel <select id="input-channel"></select></label>
        <div class="meter" role="meter" aria-label="Input level" aria-valuemin="0" aria-valuemax="1">
          <div id="meter-fill"></div>
        </div>
        <button id="clip" class="clip" type="button" title="Clipped. Click to reset.">Clip</button>
        <span id="elapsed" aria-label="Elapsed">0:00</span>
        <button id="start-recording" type="button">Start</button>
        <button id="stop-recording" type="button">Stop</button>
        <button id="cancel-recording" type="button">Cancel</button>
      </div>
      <p id="confirm-cancel" hidden>
        Discard this recording?
        <button id="discard-recording" type="button">Discard</button>
        <button id="keep-recording" type="button">Keep recording</button>
      </p>
      <button id="close-recording-bar" type="button">Close</button>
    </section>
    <form id="event-editor" aria-label="Named Event" hidden>
      <label>Name <input name="name" list="event-names" autocomplete="off" spellcheck="false" /></label>
      <datalist id="event-names"></datalist>
      <label>Data <textarea name="data" rows="3" spellcheck="false" placeholder="Optional JSON"></textarea></label>
      <p role="alert" hidden></p>
      <button type="submit">Save</button>
      <button type="button" data-cancel>Cancel</button>
    </form>
    <article id="script" aria-label="Script"></article>
    <section id="timeline" aria-label="Script Time timeline"></section>
    <script type="module" src="/src/editor.ts"></script>
  </body>
</html>
