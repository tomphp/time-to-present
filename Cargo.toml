[workspace]
resolver = "3"
members = ["crates/core", "crates/stt-sidecar", "apps/desktop/src-tauri"]
default-members = ["crates/core", "crates/stt-sidecar"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
proptest = "1"
