name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libasound2-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev libxdo-dev libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: node scripts/build-sidecar.mjs
      - run: npm test
      - run: npm run typecheck
      - run: cargo build --workspace
      - run: cargo test --workspace

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cocogitto/cocogitto-action@v4.2.0
        with:
          install-only: true
      - name: Check conventional commits since the latest component tags
        run: |
          base=$(git tag --list 'desktop-v*' 'client-v*' --sort=-creatordate | head -n 1)
          if [ -z "$base" ]; then
            base=$(git merge-base origin/main HEAD)
          fi
          cog check --ignore-merge-commits "$base..HEAD"

  release-rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: cocogitto/cocogitto-action@v4.2.0
        with:
          install-only: true
      - run: node --test '.github/release/*.test.mjs'
