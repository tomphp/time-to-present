name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/desktop-toolchain
      - run: node scripts/build-sidecar.mjs
      - run: npm test
      - run: npm run typecheck
      - run: cargo build --workspace
      - run: cargo test --workspace

  windows-smoke-test:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/desktop-toolchain
      - name: Build the app to run the smoke test, without the transcription sidecar
        run: >-
          npm run tauri -w @time-to-present/desktop -- build --debug --no-bundle --features smoke-test
          --config src-tauri/tauri.smoke-test.conf.json
      - name: Perform, then check the Teleprompter answers and closes
        id: smoke-test
        timeout-minutes: 3
        run: ./target/debug/time-to-present.exe
      - if: failure() && steps.smoke-test.conclusion == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: windows-smoke-test-log
          path: ~/AppData/Local/dev.timetopresent.desktop/logs/
          if-no-files-found: error

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cocogitto/cocogitto-action@v4.2.0
        with:
          install-only: true
      - name: Check conventional commits since the latest component tags
        run: |
          base=$(git tag --list 'desktop-v*' 'client-v*' --sort=-creatordate | head -n 1)
          if [ -z "$base" ]; then
            base=$(git merge-base origin/main HEAD)
          fi
          cog check --ignore-merge-commits "$base..HEAD"

  release-rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: cocogitto/cocogitto-action@v4.2.0
        with:
          install-only: true
      - run: node --test '.github/release/*.test.mjs'

  packed-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: ./scripts/check-packed-client.sh
